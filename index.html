{% extends "base.html" %}

{% block title %}Sessions{% endblock %}

{% block content %}
	<h1>New Chat</h1>
	<form action="/api/message" method="post">
		<div>
			<label for="prompt">Prompt:</label><br>
			<textarea name="prompt" id="prompt" rows="4" cols="50" required></textarea>
		</div>
		<div>
			<label for="model">Model:</label>
			<select name="model" id="model">
				{% for model in models %}
					<option value="{{ model.id }}" {% if loop.first %}selected{% endif %}>
						{{ model.id }}
					</option>
				{% endfor %}
			</select>
		</div>
		<div>
			<label>
				<input type="checkbox" name="reasoning" checked>
				Enable reasoning
			</label>
		</div>
		<button type="submit">Send</button>
	</form>

	<hr>

	<table>
		<tr>
			<th>Created</th>
			<th>Session</th>
		</tr>
		{% for session_id, timestamp, title in sessions %}
		<tr>
			<td>{{ timestamp|format_timestamp }}</td>
			<td><a href="/session/{{ session_id }}">{{ title }}</a></td>
		</tr>
		{% endfor %}
	</table>

{% endblock %}
