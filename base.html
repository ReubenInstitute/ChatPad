<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="/styles.css">
	<script src="/diff_match_patch.js"></script>
	<script src="/lucide.js"></script>
	<script src="/chat.js"></script>
	<title></title>
</head>
<body>

<div class="top-sticky">
<nav>
	<div class="nav-inner">
		<a href="/chat" class="{{ 'active' if (request.path == '/chat' or request.path.startswith('/chat/')) and not (archived is defined and archived) else '' }}">Chat</a>
		<a href="/archive" class="{{ 'active' if request.path.startswith('/archive') or (archived is defined and archived) else '' }}">Archive</a>
		<a href="/models" class="{{ 'active' if request.path == '/models' else '' }}">Models</a>
	</div>
</nav>
{% block topbar %}{% endblock %}
</div>

	<main>
		{% block content %}{% endblock %}
	</main>
</body>
</html>
